name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Set native control locale
        run: |
          defaults write NSGlobalDomain AppleLocale -string en_GB
          defaults write NSGlobalDomain AppleLanguages -array en-GB
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify
      - name: Collect verified package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p artifacts/package
          cp .tmp/package/*.tgz .tmp/package/packed.json artifacts/package/
      - name: Upload verified package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pancake-ui-package
          path: artifacts/package/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failures
          path: |
            test-results/
            artifacts/*.png
          if-no-files-found: ignore
